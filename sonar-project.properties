# ==============================================================================
# SECUREPAY SOLUTIONS - SONARQUBE / SONARCLOUD CONFIGURATION
# ==============================================================================

sonar.projectKey=securepay-solutions_securepay-api
sonar.projectName=SecurePay Core API
sonar.projectVersion=1.0.0

# Source & Test files
sonar.sources=src
sonar.tests=tests
sonar.exclusions=node_modules/**,coverage/**,reports/**

# Encoding
sonar.sourceEncoding=UTF-8

# Test execution & Code Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=reports/junit.xml
